</head>
<body data-page="properties">

<section class="page-hero">
  <div class="overlay"></div>
  <div class="wrap">
    <span class="eyebrow">Our Listings</span>
    <h1>Properties for <em>Sale &amp; Rent</em></h1>
    <p>Filter by location, type and purpose, then inquire directly on WhatsApp in one tap.</p>
  </div>
</section>

<section style="padding-top:46px">
  <div class="wrap">
    <div class="breadcrumbs"><a href="index.html">Home</a><span class="sep">›</span><span>Properties</span></div>
    <div class="filters" style="display:flex;gap:14px;flex-wrap:wrap;align-items:end">
      <div class="field"><label>Location</label><select id="fLoc"></select></div>
      <div class="field"><label>Type</label><select id="fType"><option value="">All types</option><option>Residential Plot</option><option>House</option><option>Commercial</option><option>Agricultural Land</option></select></div>
      <div class="field"><label>Purpose</label><select id="fPurpose"><option value="">Sale &amp; Rent</option><option>Sale</option><option>Rent</option></select></div>
      <div class="field"><label>Min Price (PKR)</label><input id="fMin" type="number" min="0" step="100000" placeholder="e.g. 1000000"></div>
      <div class="field"><label>Max Price (PKR)</label><input id="fMax" type="number" min="0" step="100000" placeholder="e.g. 5000000"></div>
      <div class="field"><label>Sort</label><select id="fSort"><option value="">Default</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option></select></div>
      <button id="btnResetFilters" class="btn btn-ghost btn-sm">Reset</button>
    </div>
    <div class="grid g3" id="propList"></div>
  </div>
</section>

<section class="dark"><div class="wrap" data-commission></div></section>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
